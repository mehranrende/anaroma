[options]
; Ozel moduller (addons/) + Odoo standart moduller
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Docker icinde disaridan erisim icin gerekli (Odoo 20+ varsayilani 127.0.0.1)
http_interface = 0.0.0.0

; Veritabani baglantisi (docker-compose.yml ile ayni)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Veritabani yonetim ekraninin ana sifresi - canliya gecmeden DEGISTIR
admin_passwd = anaroma-admin

; Gelistirme icin: 0 = tek islem, hata ayiklamasi kolay
workers = 0
limit_time_cpu = 600
limit_time_real = 1200
